<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Well Go · Leaderboard</title>
  <style>
    :root{--bg:#ffffff;--card:#f4f8f8;--ink:#182330;--mute:#5f6b78;--line:#dfe8e8;--brand:#33cccc;--brand-d:#0b8585;--navy:#182330;--gold:#f0b429}
    @media (prefers-color-scheme:dark){:root{--bg:#191919;--card:#232b33;--ink:#eef4f6;--mute:#9bb0bd;--line:#2f3a45;--brand-d:#33cccc}}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    body{display:flex;flex-direction:column;padding:6px 8px 4px;max-width:760px;margin:0 auto;overflow:hidden}
    .top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex:none}
    .top h1{font-size:14px;flex:1;white-space:nowrap}
    .seg{display:flex;background:var(--card);border-radius:8px;padding:2px}
    .seg button{border:0;background:none;color:var(--mute);font:600 11.5px inherit;font-family:inherit;padding:4px 10px;border-radius:6px;cursor:pointer}
    .seg button.on{background:var(--navy);color:#fff}
    #app{flex:1;min-height:0;display:flex;flex-direction:column}
    .stage{flex:none;background:linear-gradient(160deg,#182330,#0f6f73);border-radius:14px;padding:8px 8px 0;color:#fff;overflow:hidden}
    .podium{display:flex;align-items:flex-end;justify-content:center;gap:8px}
    .spot{flex:1;max-width:170px;text-align:center;min-width:0}
    .spot .who{display:flex;flex-direction:column;align-items:center;gap:1px;padding-bottom:4px}
    .ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;border:2px solid rgba(255,255,255,.9);flex:none}
    .spot.first .ava{width:44px;height:44px;font-size:16px;border-color:var(--gold)}
    .crown{font-size:15px;line-height:1;height:15px}
    .name{font-weight:700;font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pts{font-size:11px;opacity:.92}.pts b{font-size:13px}
    .block{border-radius:8px 8px 0 0;display:grid;place-items:center;font-weight:900;font-size:17px;color:rgba(255,255,255,.95)}
    .first .block{height:40px;background:linear-gradient(180deg,#f7c948,#e0a21a)}
    .second .block{height:28px;background:linear-gradient(180deg,#cdd6de,#9fb0bd)}
    .third .block{height:20px;background:linear-gradient(180deg,#d9a06d,#b9743f)}
    .list{flex:1;min-height:0;overflow-y:auto;margin-top:6px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;align-content:start;padding-right:2px}
    .row{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:9px;padding:4px 9px;border:1px solid var(--line);min-height:30px}
    .rank{width:18px;text-align:center;font-weight:800;font-size:12px;color:var(--mute);flex:none}
    .row .ava{width:22px;height:22px;font-size:10px;border-width:0;flex:none}
    .row .name{font-size:12.5px;flex:none;max-width:42%}
    .sub{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
    .bar{width:54px;height:5px;background:var(--line);border-radius:5px;overflow:hidden;flex:none}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-d));border-radius:5px}
    .score{min-width:62px;font-weight:800;font-size:12.5px;color:var(--brand-d);text-align:right;white-space:nowrap;flex:none}.score small{font-weight:600;color:var(--mute);margin-left:2px;font-size:10.5px}
    .empty{padding:18px;text-align:center;color:var(--mute);font-size:13px}
    @media (max-width:360px){.bar{display:none}}
  </style>
</head>
<body>
  <div class="top"><h1>🏆 Leaderboard</h1><div class="seg"><button id="bp" class="on">People</button><button id="bt">Teams</button></div></div>
  <div id="app"><div class="empty">Loading…</div></div>
  <script type="module">
    import { API_URL } from './config.js';
    const demo = !API_URL || new URLSearchParams(location.search).has('demo');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const COLORS = ['#7048e8', '#1c7ed6', '#2f9e44', '#f08c00', '#e03131', '#0b8585', '#c2255c'];
    const color = (s) => COLORS[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
    const ini = (s) => (s || '?').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
    let data = null;
    let view = 'people';

    async function load() {
      if (demo) {
        return {
          people: [['Mia', 'Team Austin', 1810, 9], ['Dan', 'Team Austin', 1675, 4], ['Jordan', 'Team ICT', 1240, 6], ['Priya', 'Team Well', 1190, 2], ['Caleb', 'Team Well', 1020, 0], ['Hannah', 'Team ICT', 870, 0], ['Sam', '', 640, 0]]
            .map(([name, team, points, streak]) => ({ name, team, points, streak, level: Math.floor(points / 300) + 1 })),
          teams: [{ name: 'Team Austin', members: 2, points: 3485 }, { name: 'Team ICT', members: 2, points: 2110 }, { name: 'Team Well', members: 2, points: 2210 }].sort((a, b) => b.points - a.points),
        };
      }
      const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'publicLeaderboard' }) });
      if (!res.ok) throw new Error('The leaderboard is not available yet.');
      return res.json();
    }

    function paint() {
      const rows = (view === 'people' ? data.people : data.teams).map((r) => ({ ...r }));
      if (!rows.length) { document.getElementById('app').innerHTML = '<div class="empty">No players yet. Log a conversation to get on the board! 🙌</div>'; return; }
      const max = Math.max(...rows.map((r) => r.points), 1);
      const sub = (r) => (view === 'people' ? [r.team || 'Solo', r.streak ? `🔥${r.streak}` : ''].filter(Boolean).join(' · ') : `${r.members} member${r.members === 1 ? '' : 's'}`);
      const top = rows.slice(0, 3);
      const order = top.length === 3 ? [1, 0, 2] : top.map((_, i) => i);
      const cls = ['first', 'second', 'third'];
      const podium = `<div class="stage"><div class="podium">${order.map((i) => { const r = top[i]; return `
        <div class="spot ${cls[i]}"><div class="who"><div class="crown">${i === 0 ? '👑' : ''}</div><div class="ava" style="background:${color(r.name)}">${esc(ini(r.name))}</div><div class="name">${esc(r.name)}</div><div class="pts"><b>${r.points.toLocaleString()}</b> pts</div></div><div class="block">${i + 1}</div></div>`; }).join('')}</div></div>`;
      const rest = rows.slice(3);
      const list = rest.length ? `<div class="list">${rest.map((r, i) => `
        <div class="row"><div class="rank">${i + 4}</div><div class="ava" style="background:${color(r.name)}">${esc(ini(r.name))}</div>
          <div class="name">${esc(r.name)}</div><div class="sub">${esc(sub(r))}</div><div class="bar"><i style="width:${Math.max(4, Math.round((r.points / max) * 100))}%"></i></div>
          <div class="score">${r.points.toLocaleString()}<small>pts</small></div></div>`).join('')}</div>` : '';
      const subs = top.length < 3 ? `<div class="list">${top.map((r, i) => `<div class="row"><div class="rank">${i + 1}</div><div class="mid"><div class="sub">${esc(sub(r))}</div></div></div>`).join('')}</div>` : '';
      document.getElementById('app').innerHTML = podium + (top.length === 3 ? '' : subs) + list;
    }

    const set = (v) => { view = v; document.getElementById('bp').classList.toggle('on', v === 'people'); document.getElementById('bt').classList.toggle('on', v === 'teams'); if (data) paint(); };
    document.getElementById('bp').onclick = () => set('people');
    document.getElementById('bt').onclick = () => set('teams');
    async function refresh() {
      try { data = await load(); paint(); }
      catch (e) { if (!data) document.getElementById('app').innerHTML = `<div class="empty">${esc(e.message || "The leaderboard couldn't load.")}</div>`; }
    }
    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
